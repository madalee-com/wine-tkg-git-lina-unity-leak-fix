name: Proton valvexbe sniper container

on:
  schedule:
    - cron:  '45 8,20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free Disk Space
        uses: LizardByte/actions/actions/more_space@master
        with:
          analyze-space-savings: true
          clean-all: true
          safe-packages: "patch,git"
      - name: Display Analysis
        run: echo '${{ steps.cleanup.outputs.space-analysis }}'
      - uses: actions/checkout@v4
      - name: Verify socket support (wine needs AF_UNIX)
        run: |
          python3 - <<'PY'
          import socket, sys
          try:
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.close()
          except OSError as e:
              print(f"Runner cannot create AF_UNIX sockets: {e}", file=sys.stderr)
              print("This build requires AF_UNIX socket support (used by wineserver).", file=sys.stderr)
              sys.exit(1)
          print("AF_UNIX socket support OK")
          PY
      - name: Compile
        run: |
          cd proton-tkg
          sed -i 's/uninstaller="false"/uninstaller="true"/' proton-tkg.cfg
          sed -i 's/autoinstall="false"/autoinstall="true"/' proton-tkg.cfg
          sed -i 's/_no_container="true"/_no_container="false"/' proton-tkg.sh
          echo '_ci_build="true"' >> proton-tkg.cfg
          touch tarplz
          yes|./proton-tkg.sh
      - name: Archive the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proton-tkg-build
          path: proton-tkg/built/*.tar
